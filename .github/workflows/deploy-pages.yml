name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Nobody with admin has flipped Settings -> Pages, so let the workflow
      # token create the site on first run.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./presentation

      - id: deployment
        uses: actions/deploy-pages@v4
