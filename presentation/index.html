<div class="stage">
  <div class="deck" id="deck">
    <!-- Slides live in sections/*.js, loaded by the script tags at the bottom of this file. -->
  </div>
</div>

<div class="progress"><i></i></div>
<div class="pager"></div>
<div class="notes-panel" hidden></div>

<script src="js/charts-lib.js"></script>
<script>
// Each sections/*.js calls Deck.section(html, init). Plain <script src> (not fetch) so the
// deck still opens straight from disk via file://.
window.Deck = {
  inits: [],
  section(html, init) {
    document.getElementById('deck').insertAdjacentHTML('beforeend', html);
    if (init) this.inits.push(init);
  },
};
</script>
<script src="sections/00-cover.js"></script>

<script src="sections/05-system-design.js"></script>
<script src="sections/06-demo.js"></script>
<script src="sections/07-checkpoint.js"></script>
<script src="sections/08-takeaways.js"></script>
<script>
// Charts create data-step nodes, so they must exist before the deck engine counts steps.
Deck.inits.forEach((init) => init());
</script>
<script src="js/deck.js"></script>
